  <path d="M36 42 C32 30, 42 24, 45 16 C46 25, 52 24, 50 32" fill="none" stroke="#c86428" stroke-width="2" stroke-linecap="round"/>
  <path d="M92 42 C96 30, 86 24, 83 16 C82 25, 76 24, 78 32" fill="none" stroke="#c86428" stroke-width="2" stroke-linecap="round"/>
  <!-- Coiled Greatsword Vertical -->
