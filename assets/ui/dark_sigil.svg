<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="emberGlow" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#d96b27" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#6e1e14" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0807" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6cbb9"/>
      <stop offset="50%" stop-color="#8f8270"/>
      <stop offset="100%" stop-color="#4a4137"/>
    </linearGradient>
    <linearGradient id="eclipse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49b4b"/>
      <stop offset="50%" stop-color="#9e3b1c"/>
      <stop offset="100%" stop-color="#3d120a"/>
    </linearGradient>
  </defs>
  <!-- Background ambient glow -->
  <circle cx="64" cy="68" r="56" fill="url(#emberGlow)"/>
  <!-- Dark Sign Eclipse Ring -->
